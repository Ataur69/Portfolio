  <style>
    :root {
      --bg-canvas: #f8f9fa;
      --grid-line: #e5e7eb;
      --text-dark: #111827;
      --text-muted: #4b5563;
      --cobalt-blue: #1652f0;
      --cobalt-hover: #1240c2;
      --canary-yellow: #ffd600;
      --border-light: #e5e7eb;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 9999px;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
      --shadow-card: 0 12px 30px -10px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
      --shadow-pop: 0 16px 36px -8px rgba(22, 82, 240, 0.25);
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      background-image: 
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 36px 36px;
      color: var(--text-dark);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 90%;
      max-width: 1220px;
      margin: 0 auto;
      padding: 0 1.25rem;
      position: relative;
      z-index: 2;
    }

    /* Script Accents */
    .script-text {
      font-family: 'Caveat', cursive;
      color: var(--cobalt-blue);
      font-size: 1.7rem;
      line-height: 1;
      display: inline-block;
      transform: rotate(-3deg);
    }

    /* Apple iOS UI Frosted Navigation Bar */
    header {
      position: sticky;
      top: 1rem;
      z-index: 100;
      padding: 0 1rem;
    }

    nav {
      position: relative;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-pill);
      padding: 0.65rem 1.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 
        0 4px 20px -2px rgba(0, 0, 0, 0.05),
        0 1px 3px 0 rgba(0, 0, 0, 0.03),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.85);
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--cobalt-blue);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--cobalt-blue);
    }

    /* Buttons */
    .btn-cobalt {
      background: var(--cobalt-blue);
      color: #fff;
      padding: 0.7rem 1.5rem;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-pop);
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-cobalt:hover {
      background: var(--cobalt-hover);
      transform: translateY(-2px);
      box-shadow: 0 20px 40px -8px rgba(22, 82, 240, 0.35);
    }

    .btn-white {
      background: #ffffff;
      color: var(--text-dark);
      border: 1px solid var(--border-light);
      padding: 0.7rem 1.5rem;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-white:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
    }

    /* Hero Section */
    .hero {
      padding: 4.5rem 0 2.25rem;
      text-align: center;
      position: relative;
    }

    .hero-top-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-pill);
      padding: 0.4rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.25rem;
    }

    .tag-2026 {
      background: var(--cobalt-blue);
      color: #fff;
      padding: 0.15rem 0.6rem;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 800;
    }

    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 7.5vw, 6.2rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -2.5px;
      text-transform: uppercase;
      margin: 0.75rem 0 1.25rem;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--cobalt-blue);
      margin-bottom: 1rem;
    }

    .hero-desc {
      max-width: 680px;
      margin: 0 auto 2.25rem;
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* High-Impact Visual MARS Showcase */
    .mars-spotlight-section {
      padding: 5rem 0 5.5rem;
      border-top: 2px solid var(--border-light);
      border-bottom: 2px solid var(--border-light);
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 100%);
      margin: 4rem 0;
      position: relative;
    }

    .mars-top-header {
      text-align: center;
      max-width: 840px;
      margin: 0 auto 3rem;
    }

    .mars-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      border: 1px solid var(--border-light);
      color: var(--cobalt-blue);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 0.45rem 1.1rem;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.25rem;
    }

    .mars-live-dot {
      width: 7px;
      height: 7px;
      background: var(--cobalt-blue);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cobalt-blue);
    }

      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      font-weight: 800;
