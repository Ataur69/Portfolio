<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ata ur Rehman | Digital, Graphic & Motion Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #090a0d;
      --bg-surface: #111319;
      --bg-surface-elevated: #191c26;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #222634;
      --radius: 14px;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 10, 13, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 72px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.95rem;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--text-main);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: 0.65rem 1.4rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-block;
      transition: var(--transition);
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.65rem 1.4rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-block;
      transition: var(--transition);
    }

    .btn-secondary:hover {
      border-color: #4b5563;
      transform: translateY(-2px);
    }

    /* Hero Section */
    .hero {
      padding: 6.5rem 0 4.5rem;
      text-align: center;
    }

    .hero .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1.1rem;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }

    .hero .badge .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5.5vw, 4.4rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 1.5rem;
    }

    .hero h1 .highlight {
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      max-width: 720px;
      margin: 0 auto 2.5rem;
      font-size: 1.15rem;
      color: var(--text-muted);
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Portfolio Section */
    .portfolio-section {
      padding: 5rem 0 6rem;
    }

    .section-header {
      margin-bottom: 2.5rem;
    }

    .section-title {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }

    .section-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .filter-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--text-main);
      color: var(--bg-dark);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 2rem;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #3f475d;
    }

    .card-media {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #181b24;
      overflow: hidden;
      position: relative;
    }

    .card-media img,
    .card-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .card:hover .card-media img,
    .card:hover .card-media video {
      transform: scale(1.03);
    }

    .card-media-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 1.5rem;
      text-align: center;
      background: radial-gradient(circle, #1e2230 0%, #111319 100%);
    }

    .card-info {
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
